[project]
name = "aisuite"
version = "0.1.0"
description = "Unified interface for frontier and local LLMs behind a single OpenAI-style API."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.39"]
# local backends speak the OpenAI wire protocol, so they reuse the openai SDK
ollama = ["openai>=1.0"]
lmstudio = ["openai>=1.0"]
# web UI (FastAPI) and briefing-document ingestion (.docx / .pdf)
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "pydantic>=2"]
docs = ["python-docx>=1.1", "pypdf>=4"]
all = ["openai>=1.0", "anthropic>=0.39", "fastapi>=0.110", "uvicorn>=0.27",
       "python-multipart>=0.0.9", "pydantic>=2", "python-docx>=1.1", "pypdf>=4"]
dev = ["pytest>=7.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aisuite"]
